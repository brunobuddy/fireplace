# Railway config-as-code. Auto-detected at the repo root, so the service needs
# NO custom config path in the dashboard — connect the repo and Railway reads
# this. Build + deploy settings only: Railway does NOT read env vars / secrets
# from this file. Set those once with `deploy/railway-setup.sh` (or by hand in
# the dashboard) — see deploy/RAILWAY.md.
#
# Schema: https://docs.railway.com/reference/config-as-code
#
# Single service: the Dockerfile builds both workspaces and NestJS serves the
# API + the built SPA on one port. Build context is the repo root (this dir),
# which is what backend/Dockerfile expects.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
