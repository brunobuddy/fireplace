# Two ways to use this file:
#   • `npm run db:up`   → just Postgres (local dev DB; no profile)
#   • `npm run app:up`  → the full app (one service: API + SPA) + Postgres
#
# The app is a SINGLE service — NestJS serves the SPA and the API on one
# port. Override the host port with APP_HOST_PORT to avoid collisions.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fireplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fireplace
      POSTGRES_PASSWORD: fireplace
      POSTGRES_DB: fireplace
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - fireplace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireplace -d fireplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fireplace-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_SYNCHRONIZE: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: fireplace
      DB_PASSWORD: fireplace
      DB_NAME: fireplace
      # Login gate. NODE_ENV=production here, so both MUST be set or the app
      # refuses to boot. Demo values — override for anything real. The secret is
      # an unlock pattern (cells of the 3x3 grid, row-major): 0367852 is the "U"
      # down the left column, across the bottom and up the right.
      AUTH_USERS: "alex@fireplace.app:0367852,sam@fireplace.app:0367852"
      JWT_SECRET: "local-compose-dev-secret-change-me"
      JWT_EXPIRES_IN: "7d"
    ports:
      - "${APP_HOST_PORT:-3000}:3000"

volumes:
  fireplace-pgdata:
